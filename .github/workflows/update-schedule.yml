name: Refresh outage schedule

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-outage-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the small scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch and validate public schedule data
        run: python scripts/update_schedule.py

      - name: Commit only changed schedule data
        run: |
          if git diff --quiet -- data/schedule.json; then
            echo "No schedule changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.json
          git commit -m "chore: refresh outage schedule"
          git push
